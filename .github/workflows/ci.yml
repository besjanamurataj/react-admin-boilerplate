name: CI

# Push-triggered runs also show up as checks on pull requests, so there's no
# separate pull_request trigger (that would run everything twice per push)
on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the run still in progress; runs on main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Vite 8 and ESLint 10 need Node 22.13 or newer; '22' resolves to the latest 22.x
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # tsc -b type-checks the whole project before Vite bundles it
      - name: Build
        run: npm run build

  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      # Registry paths must be lowercase, the org name is not
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Other branches only build the image to check the Dockerfile; main also publishes it
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy frontend
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, prod]

    steps:
      - name: Pull and restart frontend
        working-directory: /opt/base-react
        run: |
          docker compose pull frontend-react
          docker compose up -d frontend-react
          docker image prune -f
