name: CI

# Push-triggered runs also show up as checks on pull requests, so there's no
# separate pull_request trigger (that would run everything twice per push)
on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the run still in progress; runs on main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Vite 8 and ESLint 10 need Node 22.13 or newer; '22' resolves to the latest 22.x
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # tsc -b type-checks the whole project before Vite bundles it
      - name: Build
        run: npm run build
